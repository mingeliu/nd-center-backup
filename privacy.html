<h1>ND Center Backup 隱私權政策</h1>
<ol>
<li>本應用程式僅存取授權使用者的 Google Drive，用於備份 Network Doctor 授權中心的資料（授權資料、站台資料、程式碼與設定）。</li>
<li>本應用程式不會收集、分享或販售任何個人資料，也不會將資料提供給第三方。</li>
<li>備份資料僅儲存在使用者指定的 Google Drive 資料夾內，不會傳送到其他地方。</li>
<li>使用者可隨時在 Google 帳戶設定中撤銷本應用程式的存取權限；撤銷後備份即停止，不會再存取 Drive。</li>
</ol>
